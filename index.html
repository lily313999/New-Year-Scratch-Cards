<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>新年刮刮樂</title>
  <link rel="stylesheet" href="style.css">

    <!-- Open Graph 基本標籤 -->
    <meta property="og:title" content="新年刮刮樂">
    <meta property="og:description" content="🧧🧧🧧刮出你的新年好運🧧🧧🧧祝大家新年快樂，馬年大吉">
    <meta property="og:image" content="img/banner3.png"> <!-- 分享時顯示的圖片 -->


</head>
<body>

<div id="app">

  <!-- 起始畫面 -->
  <div id="startScreen" class="screen start-screen">
    <img src="img/banner.png" class="banner">

    <input id="nickname" placeholder="輸入暱稱">
    <button id="startBtn">開始刮獎</button>
  </div>

  <!-- 遊戲畫面 -->
  <div id="gameScreen" class="screen hidden">

    <!-- 新增的 Banner -->
    <img src="img/banner2.png" class="game-banner">

    <div id="playerName"></div>

    <div id="cardBox">

        <div id="loadingLayer">
        <img src="img/loading.png" alt="載入中">
        </div>

      <img id="prizeImg">
      <canvas id="scratchCanvas"></canvas>
    </div>

    <button id="newCardBtn">再刮一張</button>
  </div>

</div>

<script src="script.js"></script>
<script>
  // 取得元素
  const startBtn = document.getElementById("startBtn");
  const newCardBtn = document.getElementById("newCardBtn");
  const nicknameInput = document.getElementById("nickname");

  // 點擊開始遊戲
  startBtn.addEventListener("click", () => {
    const name = nicknameInput.value || "玩家";
    document.getElementById("playerName").innerText = `新年快樂，${name}`;

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("gameScreen").classList.remove("hidden");

    // 🎵 使用者互動後播放背景音樂（不會被擋）
    bgm.play().catch(() => {});


      // 🔥 先預載，再顯示第一張
    preloadImages(() => {
        document.getElementById("loadingLayer").style.display = "none";
        document.getElementById("prizeImg").style.opacity = 1;
        document.getElementById("scratchCanvas").style.opacity = 1;
        newCard();
      });
  });

  // 點擊再刮一張
  newCardBtn.addEventListener("click", () => {
    newCard(); // 直接呼叫 script.js 的 newCard()
  });

  // 支援按 Enter 鍵開始遊戲
  nicknameInput.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      startBtn.click();
    }
  });
</script>

</body>
</html>
